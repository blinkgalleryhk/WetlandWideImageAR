<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Targets</title><meta itemprop="name" content="Image Targets"><meta name="twitter:title" content="Image Targets"><meta property="og:title" content="Image Targets"><meta property="og:site_name" content="Image Targets"><meta name="description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><meta itemprop="description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><meta property="og:description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><meta name="twitter:description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script><meta property="og:image" content="https://8thwall.org/studio-image-targets-example/assets/preview.png"></head><body><style>#scene-carousel-wrap {
    position: fixed;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(92vw, 420px);
    z-index: 999999;
    pointer-events: none;
  }

  #scene-carousel {
    display: flex;
    gap: 10px;
    align-items: center;
    overflow-x: auto;
    padding: 8px 10px;
    border-radius: 999px;
    background: rgba(12, 18, 24, 0);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -ms-overflow-style: none;
    pointer-events: auto;
  }

  #scene-carousel::-webkit-scrollbar {
    display: none;
  }

  .scene-icon {
    flex: 0 0 auto;
    width: 70px;
    height: 70px;
    border: 2px solid rgb(255, 255, 255);
    border-radius: 50%;
    background-color: rgb(255, 255, 255);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    cursor: pointer;
    scroll-snap-align: center;
    overflow: hidden;
    position: relative;
    transition: transform 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    touch-action: manipulation;
    user-select: none;
  }

  .scene-icon::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1.5px dashed rgba(255, 255, 255, 0.38);
    background: rgba(255, 255, 255, 0.02);
  }

  .scene-icon.active {
    border-color: rgba(166, 255, 142, 0.9);
    transform: scale(1.08);
  }

  .scene-icon:active {
    transform: scale(0.96);
  }</style><div id="scene-carousel-wrap" aria-label="Scene selector carousel"><div id="scene-carousel" aria-live="polite"></div></div><script>;(function () {
    const sceneCarousel = document.getElementById('scene-carousel')
    if (!sceneCarousel) return

    const sceneImageMap = {

      'Wetland AR': './assets/wetlandfullAR_1_1.png',
      'Migration': './assets/bird_migration_1.png',
      'Wetlandfield': './assets/wetlandbigeyecompressed.png',
      'WetlandAR2': './assets/WetlandfullLeft_1.png',

    }

    const getCurrentScene = () => {
      const app = window.ecs && window.ecs.application
      if (!app || typeof app.getScene !== 'function') return null
      return app.getScene()
    }

    const setSceneButtonImage = (button, sceneName) => {
      const imagePath = sceneImageMap[sceneName] || sceneImageMap[sceneName.toLowerCase()] || ''
      if (imagePath) {
        button.style.backgroundImage = `url("${imagePath}")`
        button.style.backgroundColor = 'transparent'
      } else {
        button.style.backgroundImage = 'none'
        button.style.backgroundColor = 'rgba(255, 255, 255, 0.06)'
      }
    }

    const centerSelectedScene = () => {
      const activeButton = sceneCarousel.querySelector('.scene-icon.active')
      if (!activeButton) return

      const offsetLeft = activeButton.offsetLeft
      const offsetWidth = activeButton.offsetWidth
      const scrollTarget = offsetLeft - (sceneCarousel.clientWidth / 2) + (offsetWidth / 2)
      sceneCarousel.scrollTo({left: scrollTarget, behavior: 'smooth'})
    }

    const renderSceneButtons = () => {
      const scene = getCurrentScene()
      if (!scene || typeof scene.listSpaces !== 'function') return

      const spaces = scene.listSpaces ? scene.listSpaces() : []
      if (!spaces || spaces.length === 0) return

      sceneCarousel.innerHTML = ''

      spaces.forEach((space) => {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = 'scene-icon'
        button.title = space.name || space.id
        button.setAttribute('aria-label', space.name || space.id)

        const sceneName = space.name || space.id
        setSceneButtonImage(button, sceneName)

        const activeSpace = scene.getActiveSpace ? scene.getActiveSpace() : null
        const isActive = !!activeSpace && (space.id === activeSpace.id || space.name === activeSpace.name)
        if (isActive) button.classList.add('active')

        button.addEventListener('click', function () {
          scene.loadSpace(space.id || space.name)
          renderSceneButtons()
          window.setTimeout(centerSelectedScene, 0)
        })

        sceneCarousel.appendChild(button)
      })

      window.setTimeout(centerSelectedScene, 0)
    }

    const refreshSceneButtons = () => {
      renderSceneButtons()
    }

    refreshSceneButtons()
    window.addEventListener('focus', refreshSceneButtons)
    window.addEventListener('resize', refreshSceneButtons)
  }())</script><script src="bundle.js"></script></body></html>
